services:
  - type: web
    name: did-it-help
    runtime: node
    plan: starter # a persistent disk needs a paid plan
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_PATH
        value: /var/data/did-it-help.db
      - key: JWT_SECRET
        generateValue: true
      - key: DIGEST_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: VIASOCKET_ASK_WEBHOOK_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
